<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="./image/quality_icons.webp">
    <title>Document</title>
    <style>
        *::after::before{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        header{
            background-color: grey;
            padding: 15px;
            text-align: center;
            color: blanchedalmond;
            font-size: 32px;
        }
        nav{
            background-color: palevioletred;
            color: rgb(167, 247, 8);
            text-align: center;
            padding: 15px;
            font-size: 25px;
        }
        main{
            background-color: royalblue;
            width: 100%;
            height: 85vh;
            display: flex;
        }
        .left-main{
            width: 50%;
            height: 100%;
            background-color: rosybrown;
        }
        section{
            width: 100%;
            height: 50%;
            background-color: rgb(100, 129, 6);
        }
        article{
            width: 100%;
            height: 50%;
            background-color: goldenrod;
        }
        aside{
            width: 80%;
            height: 80%;
            background-color:palegreen ;
        }
        footer{
            background-color: lightseagreen;
            padding: 15px;
            font: size 35px;
            text-align: center;
            color: black;
        }
        .right-main{
            width: 50%;
            height: 100%;
            background-color:lightcoral ;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <header>Header</header>
    <nav>Navigation</nav>
    <style>

    </style>
    <main>
        <div class="left-main">
            <section></section>
            <article></article>
        </div>
        <div class="right-main">
            <aside></aside>
        </div>
    </main>
    <footer>Footer</footer>
</body>
</html>
