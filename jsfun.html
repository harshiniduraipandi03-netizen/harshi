<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUNCTION</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #74ebd5, #9face6);
        }
        form{
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 350px;
        }
        label{
            display:block;
            margin-bottom:5px;
            font-weight:bold;
        }

        input{
            width:100%;
            padding:10px;
            margin-bottom:15px;
            border:1px solid #ccc;
            border-radius:6px;
            outline:none;
        }

        input:focus{
            border-color:#4a90e2;
        }

        button{
            width:100%;
            padding:10px;
            border:none;
            border-radius:6px;
            background:#4a90e2;
            color:white;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#357abd;
        }

    </style>
</head>
<body>
    <form action="main">
        <label for="">Name:</label>
        <input type="text" id="name"><br>
        <label for="">Age:</label>
        <input type="number" id="age" min="18" max="25"><br>
        <label for="">Email:</label>
        <input type="email" id="email"><br>
         <button type="button" onclick="Data()">Submit</button>
    </form>
    <script>

        function Sample(name, age, email)
        {
            console.log(name);
            console.log(age);
            console.log(email);
        }

        function Data()
        {
            let name = document.getElementById("name").value;
            let age = document.getElementById("age").value;
            let email = document.getElementById("email").value;

            Sample(name, age, email);
        }

</script>
</body>
</html>
