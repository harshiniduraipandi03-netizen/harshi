<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        body{
            font-family: Arial;
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            background: #9522ff70;
            padding: 20px;
        }
        .main{
            width: 380px;
            background: white;
            border: 2px solid black;
            padding: 20px;
            margin: auto;
        }
        h2{
            text-align: center;
        }
        input,select{
            width: 90%;
            padding: 8px;
            margin: 6px 0 12px 0;
        }
        button{
           width: 98%;
           padding: 10px;
           background: #2196f3;
           color: white;
           border: none;
           border-radius: 5px;
           cursor: pointer;
           font-weight:bold ;
        }
        #resultBox{
            width: 320px;
            min-height: 400px;
            padding: 20px;
            border: 2px solid #2196f3;
            border-radius: 10px;
            line-height: 1.8;
            gap: 15px;
            background: #e3f2fd;
        }
        #resultBox p{
            font-size: 18px;
            margin: 8px 0;
        }
        
    </style>
</head>
<body>
     
         <div class="main">
            <h2>JavaScript</h2>
            <form action="">
            <label for="studentName"><b>Name :</b></label>
            <input type="text" id="studentName" placeholder="Harshini"><br>
            <label for="studentId"><b>StudentID :</b></label>
            <input type="text" id="studentId" placeholder="STU003"><br>
            <label for="email"><b>Email :</b></label>
            <input type="text" id="email" placeholder="harshiniduraipandi03@gmail.com"><br>
            <label for="department"><b>Department :</b></label>
            <select id="department">
                <option value="Java Full Stack">Java Full Stack</option>
                <option value="Python Full Stack">Python Full Stack</option>
                <option value="MERN Stack">MERN Stack</option>
                <option value="Data Analytics">Data Analytics</option>
            </select><br>
            <label for="mark"><b>Mark :</b></label>
            <input type="number" id="mark" placeholder="85"><br>
           
            <button type="button" onclick="checkResult()">check result</button>
            </form>
             </div>
        
            <div id="resultBox"></div>   
         <script>
            function checkResult(){
                let studentName = document.getElementById("studentName").value.trim();
                let studentId = document.getElementById("studentId").value.trim();
                let email = document.getElementById("email").value.trim();
                let department = document.getElementById("department").value;
                let markValue = document.getElementById("mark").value.trim();
                let mark = Number(markValue);
                
                if(studentName === "" || studentId === "" || email === "" || markValue===""){
                    alert("Please fill all fields");
                    return;
                }
                if(isNaN(mark)||mark < 0 || mark > 100){
                    alert("Invalid Mark");
                    return;
                }
               
                 let grade= "";

                 let performance= "";

                 if(mark>=90 ){ grade="A+";
                 performance= "Outstanding";} 
                 
                 else if(mark>=80){ 
                    grade="A";
                   performance= "Excellent";}
                 else if(mark>=70 ){
                    grade="B";
                    performance= "Good";}
                 else if(mark>=50) {
                    grade="C"; performance= "Average"}
                 else grade="F";
                    performance= "Poor"

                 let result = mark >= 50? "PASS": "FAIL";
                    eligibility= mark >= 50 ? "Eligible for Next Level": "Not Eligible";
                 let isEmailValid= email.includes("@")&& email.includes(".");
                 let isIdValid= studentId.startsWith("STU");

                
                let deptMessage = "";
                switch(department){
                    case "Java Full Stack": deptMessage="Recommended: Advanced Java & Spring Boot"; break;
                    case "Python Full Stack": deptMessage="Recommended: Django & REST API"; break;
                    case "MERN Stack": deptMessage="Recommended: React, Node.js & MongoDB"; break;
                    case "Data Analytics": deptMessage="Recommended: PowerBI & SQL"; break;
                    default: deptMessage="Recommended: Please select a department";
                }

                 document.getElementById("resultBox").innerHTML= `
                    <h3>Student Details</h3>
                    <p><b>Name:</b> ${studentName}</p>
                    <p><b>Student ID:</b> ${studentId}</p>
                    <p><b>Email:</b> ${email}</p>
                    <p><b>Department:</b> ${department}</p>
                    <p><b>Mark:</b> ${mark}</p>
                    <p><b>Grade:</b> ${grade}</p>
                    <p><b>Result:</b> ${result}</p>
                    <p><b>Performance:</b> ${performance}</p>
                    <p><b>Eligibility:</b> ${eligibility}</p>
                `;
                }
         </script>
</body>
</html>
