<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        .main{
            width: 450px;
            height: 600px;
            /*background-color: rgb(61, 214, 61);*/
            margin:30px auto;
            border: 1px solid #ccc;
            
        }
        h2{
            background-color: lightcoral;
            padding: 7%;
            color: #fff ;
            text-align: center;
            font-style: 𝐓𝐲𝐩𝐞 𝐬𝐨𝐦𝐞𝐭𝐡𝐢𝐧𝐠 𝐭𝐨 𝐬𝐭𝐚𝐫𝐭;
            font-weight: bold;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-size: 20px;
           
        }
        .gallery{
            width: 100%;
            height: 85%;
            background-color: #41e573;
            display: grid;
            grid-template-columns: repeat(3,1fr);
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            padding: 10px;
            overflow-y:auto;
            
        }
        .img{
            width: 100%;
            height: 100px;
            border-radius: 5px;
            opacity: 0.7;
            object-fit: cover;
            cursor: pointer;
            transition: all 0.4s ease;
            border: 2px solid transparent;
           
        }
        .gallery:nth-child(16):hover{
            box-shadow: 0 0 0 3px white, 0 0 15px white;
            transform: scale(1.1);
            opacity: 0.9;
            shape-image-threshold: 0.5;
        }
        

    </style>
</head>
<body>
    <div class="main">
        <h2>Image Gallery</h2>
        <div class="gallery">
            <img src="./image/dudu ima.jpg" alt="">
            <img src="./image/dudu ima.jpg" alt="">
            <img src="./image/dudu ima.jpg" alt="">

            <img src="./image/dudu ima.jpg" alt="">
            <img src="./image/dudu ima.jpg" alt="">

            <img src="./image/dudu ima.jpg" alt="">
            <img src="./image/dudu ima.jpg" alt="">
            <img src="./image/dudu ima.jpg" alt="">
            <img src="./image/dudu ima.jpg" alt="">
            <img src="./image/dudu ima.jpg" alt="">
            <img src="./image/dudu ima.jpg" alt="">
            <img src="./image/dudu ima.jpg" alt="">
            <img src="./image/dudu ima.jpg" alt="">
            <img src="./image/dudu ima.jpg" alt="">

        </div>

    </div>
    
</body>
</html>
