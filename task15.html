<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        .main{
            width: 200px;
            margin:30px auto;
            height: 200px;
            background-color: brown;
            /*position: absolute;
            animation: move 5s linear 0s 4 reverse;*/
        }
        @keyframes colorchange{
            from{
               background-color: rgb(68, 0, 255);}
               to{background-color: yellow;}
        }
        @keyframes move{
            0%
            {left:0%;top:0%; background-color: burlywood; border-radius: 10%;}
            25%
            {left: 80%; top: 0%; background-color: rgb(255, 213, 0); border-radius: 20%;}
            
        }
    </style>
</head>
<body>
    <div class="main"></div>
</body>
</html>
