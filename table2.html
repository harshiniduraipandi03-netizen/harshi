<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="icon" type="image/png" href="./image/quality_icons.webp">
    <title>Document</title>
    <style>
        *{
            margin: 20px;
            padding: 10px;
            box-sizing: border-box;
            font-size: 20px;
        }
        table{
            background-color: #0fbef3;
            border: 2px solid blanchedalmond;
            margin: 30px auto;
        }
        table , tr,th,td{
            border-collapse: collapse;
        }
        tr,th,td{
            border: 2px solid black;
            font-size: 20px;
            padding: 5px 15px;
        }
        #th:nth-child(2){
            background-color: lightslategray;
        }
        #gender{
            background-color:peru ;
        }
        tr:hover{
            background-color: lightgreen;
        }
        td:hover{
            background-color:lightcoral ;
        }

    </style>
</head>
<body>
    <table>
        <tr>
            <th>no</th>
            <td>1</td>
            <td>2</td>
            <td>3</td>
            <td>4</td>
        </tr>
        <tr>
            <th>name</th>
            <td>gugan</td>
            <td>thiya</td>
            <td>santhosh</td>
            <td>kirthik</td>
        </tr>
        <tr>
            <th>age</th>
            <td>10</td>
            <td>05</td>
            <td>19</td>
            <td>15</td>
        </tr>
        <tr>
            <th id="gender">gender</th>
            <td>male</td>
            <td>female</td>
            <td>male</td>
            <td>male</td>
        </tr>
    </table>
</body>
</html>
