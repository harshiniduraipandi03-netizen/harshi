<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        .dropdown{
            background-color: rgb(232, 111, 111);
            width: 200px;
            height: auto;
            margin: 200px auto;
        }
        button{
            width: 100%;
            padding: 8px 10px;
            font-size: 18px;
            border: none;
        }
        .dropdowncon{
            list-style-type: none;
            text-align: center;
            /*display: none;*/
        }
        .dropdowncon >li{
            border-bottom: 2px solid rgb(18, 89, 84);
        }
        .like{
            text-decoration: none;
            font-size: 20px;
            display: inline-block;
            width: 100%;
            height: 100%;
            padding: 5px 10px;
        }
        #dropdown:hover #dropdowncon{
           display: block;
        }
        .like:hover{
            background-color: black;
            color: rgb(239, 139, 9);
        }
    </style>
</head>
<body>
    <div class="dropdown" id="dropdonw">
        <button>Menu</button>
        <ul class="dropdowncon" id="dropdowncon">
            <li><a href="" class="like">Home</a></li>
            <li><a href="" class="like">Contact</a></li>
            <li><a href="" class="like">Services</a></li>
            <li><a href="" class="like">Product</a></li>
            <li><a href="" class="like">Portfolio</a></li>
        </ul>
    </div>
</body>
</html>
