<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding:0px;
            box-sizing: border-box;
        }
        .main{
            width: 100%;
            height: 100vh;
            background-color: rgb(154, 114, 238);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .inner{
            width: 330px;
            height: 400px;
            border-radius: 5px;
        }
        .head{
            width: 100%;
            height: 30%;
            background-color:rgb(2, 9, 84);
            border-top-left-radius: 5px;
            border-top-right-radius:5px;
        }
        .mid{
            width: 100%;
            height: 80%;
            background-color: whitesmoke;
            position: relative;
        }
        /*.foot{
            width:100%;
            height:20%;
            background-color: whitesmoke;
            border-top:1px solid gray;
            border-bottom-left-radius:5px;
            border-bottom-right-radius:5px;
        }*/
        .image{
            width: 120px;
            height: 120px;
            position: absolute;
            left: 33%;
            top:-25%;
            border-radius: 50%;
            border: 5px solid rgba( 2, 9, 84,) ;
            /*clip-path: oval shap;*/
        }
        .para1{
            position: absolute;
            top: 100px;
            left: 30%;
            font-size: 25px;
            letter-spacing: 2px;
        }
        .para2{
            position: absolute;
            top: 150px;
            left: 40%;
            font-size: 20px;
            letter-spacing: 1px;
        }

    </style>
</head>
<body>
    <div class="main">
        <div class="inner">
            <div class="sub head"></div>
            <div class="sub mid">
               <img src="image/usain.jpg" alt=""class="image">
               <p class="para1">Usain bolt</p>
               <p class="para2">You </p>
            </div>
            <div class="sub foot"></div>
        </div>

    </div>
</body>
</html>
