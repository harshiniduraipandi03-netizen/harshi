<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="./image/quality_icons.webp">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding: 10px;
            box-sizing: border-box;
           
        }
       .main{
        width:400px;
        height: 550px;
        background: linear-gradient(rgba(3,14,78),rgba(5,95,57));
        margin: 50px auto;
       }
       .top{
        width: 50%;
        height: 30%;
        /*position: absolute;*/
        display: flex;
        left: 5px;
       }
       .title{
        text-align: center;
        color: white;
        font-size: 10px;
        font-weight: 200;
        margin-top: 15px;
        justify-content: center;
       }
        .dot{
            width: 2px;
            height: 2px;
            border-radius: 10%;
            gap: 10px;
        }
        .red{background: #ff5f57;}
        .yellow{background: #febc2e;}
        .green{background: #28c840;}

       img{
        width: 60px;
        height: 60px;
        border-radius: 30px;
        border: 2px solid lightseagreen;
        /*margin-top: 70px;
        display: block;*/
       }
       img:hover{
        margin-top: 10px;

       }
       h1{
        color: white;
       }
       .bottom{
        width: 100%;
        height: 70%;
       }
       .label{
        color: white;
        /*display: block;*/
        font-size: 20px;
        margin-bottom: 11px;
        margin-left: 20px;
        margin-top: 5px;
        padding: 2px;
       }
       .label:hover{
        margin: auto;
        position: absolute;
        justify-content: center;
       }
       .input{
        border-radius: 10px;
        margin-left: 20px;
        width: 90%;
        height: 30px;
       }
       button{
        border-radius: 10px;
        margin-left: 20px;
        width: 90%;
        height: 30px;
        background-color: #d2cc1b;
       }
       #street{
        color: white;
        font-size: 10px;
       }
       #line{
        color: white;
        font-size: 10px;
       }
       #city{
        color: white;
        font-size: 10px;
       }
       .browser-dots{
        position: absolute;
        top: 13px;
        left: 18px;
        display: flex;
        gap: 4px;
       }
       .dot{
        width: 5px;
        height: 5px;
        border-radius: 50%;
        display: block;
       }
       .red{
        background-color: red;
       }
       .yellow{
        background-color: yellow;
       }
       .green{
        background-color: green;
       }

        
    </style>
</head>
<body>
        <form action="">
        <div class="main">
        <div class="top">
        <div class="top-bar">
            <div class="browser-dots">
            <span class="dop red"></span>
            <span class="dop yellow"></span>
            <span class="dop green"></span>
            </div>
        </div>
        <div class="logo">
            <img src="./image/logo girl" alt="logo">
        </div>
        <h1 class="title">On-Site Enquiries Form</h1>
        <div class="bottom">
            <div class="form">
            <label for="">NAME> <span style="color: red;">*</span></label><br>
            <input type="text" class="input-box"><br>
            <label for="">Where are you> <span style="color: red;">*</span></label><br>
            <input type="text" class="input-box"><br>
            <label for="small-label">Street Address</label><br>
            <input type="text" class="input-box"><br>
            <label for="small-label">Address Line 2</label><br>
            <input type="text" class="input-box"><br>
            <label for="small-label">City</label><br>

            <button class="submit-button">SUBMIT</button>
        </div>
        </div>
        </div>
        </div>
        </form>
      
</body>
</html>
