<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        nav{
            width: 100%;
            height: 10vh;
            justify-content: space-between;
            align-items: center;
            display: flex;
            position: relative;
            background-color: blueviolet;
            z-index: 10;
        }
        .edu-pro{
            width: 250px;
            height: 100%;
            background-color: lightgreen;
            display: flex;
            /* gap: 10px;
            font-weight: bold; */
            align-items: center;
        }
        img{
            width: 50px;
            height: 50px;
        }
        .edu-pro span{
            font-size: 30px;
            font-weight: 600;
            margin-left: 15px;
            font-family: sans-serif;
        }
        ul{
            background-color: seagreen;
            width: 600px;
            height: 100%;
            padding: 0;
            margin: 0;
            /* font-size: 20px; */
            display: flex;
            /* list-style: none; */
            /* gap: 20px; */
            justify-content: center;
            align-items: center;
        }
        .ul>li{
            list-style-type: none;
            padding: 15px 20px;
        }
        .link{
            text-decoration: none;

        }
        .request-btn{
            width: 200px;
            height: 100%;
            /* background-color: brown; */
            display: flex;
            align-items: center;
            justify-content: center;
            /* margin-left: auto; */
        }
        .request-btn>i{
            /* background-color: rgb(155, 164, 164); */
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 23px;
            color: black;
        }
        .request-btn> button{
            background-color: lightcoral;
            font-size: 20px;
            padding: 10px;
            border: none;
            color: whitesmoke;
            border-radius: 15px;
            /* margin-left: 10px; */
        }
        .menu-bar{
            display: none;
            width: 50px;
            height: 50px;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            cursor: pointer;
        }
        .hero-section{
            display: flex;
            justify-content: space-between;
            gap: 20px;
            position: relative;
            z-index: 1;
            background-color: #f1f7fd;
        }
        .con{
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: start;
            gap: 20px;
            width: 50%;
            padding: 20px 40px;
            margin: 10px 30px;
        }
        .sub-heading{
            color: burlywood;
            font-size: 15px;
            letter-spacing: 1px;
        }
        .heading{
            font-size: 47px;
            font-weight: 700;
            line-height: 1.1;
        }
        .description{
            font-size: 18px;
            line-height: 1.5;
        }
        button{
            background-color: sienna;
            color: white;
            font-size: 18px;
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid teal;
            margin-right: 10px;
        }
        .button2{
            background-color: white;
            color: yellow;
        }
        .con-img{
            margin: auto;
        }
        .con-img>img{
            width: 300px;
            height: 100%;
        }
        @media screen and (max-width: 831px) {

            nav {
                width: 100%;
                height: 70px;
                position: relative;
                z-index: 10;
            }

            .edu-pro {
                width: auto;
                height: 70px;
                margin-left: 15px;
            }

            .edu-pro img {
                width: 45px;
                height: 45px;
            }

            .edu-pro span {
                font-size: 25px;
                margin-left: 8px;
            }

            .ul {
                position: absolute;
                top: 70px;
                left: 0;
                width: 100%;
                height: 0;
                background-color: plum;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 0;
                overflow: hidden;
                transition: height 1s ease;
                z-index: 10;
            }

            .ul > li {
                padding: 15px;
            }

            .link {
                color: white;
                font-size: 18px;
                text-decoration: none;
            }

            
            .request-btn {
                display: none;
            }

            
            .menu-bar {
                display: flex;
                margin-left: auto;
                margin-right: 20px;
                font-size: 25px;
                cursor: pointer;
                z-index: 20;
            }

            .hero-section {
                width: 100%;
                min-height: auto;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }
            .con {
                width: 100%;
                margin: 0;
                padding: 40px 20px;

                align-items: center;
                text-align: center;
            }
            .heading {
                font-size: 35px;
            }

            .description {
                font-size: 16px;
            }
            .btn-group {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 10px;
            }
            .button1,
            .button2 {
                margin-right: 0;
            }
            .con-img {
                width: 100%;
                height: 400px;
            }
            .con-img img {
                width: 100%;
                height: 100%;
                margin-top: 0;
                object-fit: cover;
            }
        }
       
    </style>
</head>
<body>
    <nav>
        <div class="edu pro">
            <img src="./image/hat-img-js.jpg" alt="hat">
            <span>EduPro</span>
        </div>
        <ul class="ul" id="ul">
            <li><a href="" class="link">Home</a></li>
            <li><a href="" class="link">About</a></li>
            <li><a href="" class="link">Course</a></li>
            <li><a href="" class="link">Blog</a></li>
            <li><a href="" class="link">Contact</a></li>
        </ul>
        <div class="request-btn">
            <i class="fa-solid fa-magnifying-glass"></i>
            <button>Get Started</button>
        </div>
        <img onclick="toggle()" class="menu-bar" src="./image/menu-bar.png" alt="">
    </nav>
    <section class="hero-section">
        <div class="con">
            <h3 class="sub-heading">LEARN ANYTHING, ANYWHERE</h3>
            <h1 class="heading">Build Your Future With Better Learning</h1>
            <p class="description">Join thousands of students and learn new skills with our expert insturctors.</p>
            <div class="btn-group">
                <button>Explore Courses</button>
                <button class="button 2">Watch Video</button>
            </div>
        </div>
        <div class="con-img">
            <img src="./image/js-img.jpeg" alt="">

        </div>
    </section>
    <script>
        let toggled= false;
        function toggle(){
            // const sidebar=document.getElementById("ul");
            if(!toggled){
                document.getElementById("ul").style.height= "250px";
                toggled=true;
                return;
            }
            if(toggled){
                document.getElementById("ul").style.height= "";
                toggled= false;
                return;
            }
        }
    </script>
</body>
</html>
