<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        .main{
            width: 350px;
            height: 500px;
            background-color: rgb(157, 125, 188);
            margin: 50px auto;
            background-image: url("./image/photo1.avif");
            background-repeat: no-repeat;
            background-size: 100% 100%;
            position: relative;
            /*overflow: hidden;*/
        }
        .sub{
            width: 100%;
            height: 100%;background-color: lightcoral;
            position: absolute;
            right: 100%;
        }
        .main:hover.sub{
            right: 10%;
            transition-property: right;
            transition-duration: 5s;
            transition-timing-function:linear ;
            transition-delay: 5s;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="sub"></div>
    </div>
</body>
</html>
