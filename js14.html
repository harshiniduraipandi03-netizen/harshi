<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fan Blade Rotation</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    height:100vh;
    gap:50px;
}

.blades{
    width:250px;
    height:250px;
    object-fit:contain;
    transform-origin:center center;
}

.rotate{
    animation:spin 0.5s linear infinite;
}

@keyframes spin{
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(360deg);
    }
}

button{
    padding:10px 25px;
    font-size:18px;
    margin:0 10px;
    cursor:pointer;
}
</style>
</head>

<body>


<img src="./image/fan-blades-png.jpg" id="blades" class="blades" alt="Fan Blade">



    <!-- <button onclick="fanOn()">ON</button>
    <button onclick="fanOff()">OFF</button> -->
    <div>

    <button onclick="fanOn()">ON</button>

    <button onclick="increaseSpeed()">+</button>

    <button onclick="decreaseSpeed()">-</button>

    <button onclick="fanOff()">OFF</button>

</div>
<script>
const blades = document.getElementById("blades");
let speed = 0.5
function fanOn(){
    blades.classList.add("rotate");
}

function fanOff(){
    blades.classList.remove("rotate");
}
function increaseSpeed(){
    speed= speed-0.1;
    if(speed<0.1)
    {
        speed=0.1;
    }
    blades.style.animationDuration = speed + "s";
}

function decreaseSpeed()
{
    speed = speed + 0.1;

    blades.style.animationDuration = speed + "s";
}


</script>

</body>
</html>
